[project]
name = "code-review-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishnu", email = "vishnudusa0607@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "typer>=0.29.2",
]

[project.scripts]
github-readonly-mcp = "code_review_agent.github_mcp:main"
code-review-agent = "code_review_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
